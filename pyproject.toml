[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stigma-quant"
version = "0.1.0"
description = "Independent price-series statistical and econometric quant research engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "requests>=2.31"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
